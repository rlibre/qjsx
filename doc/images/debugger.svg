<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" viewBox="0 0 880 336" role="img" aria-label="VS Code talks CDP to qjsx debug on the PC, which holds the debug info and the compiler; qjsx debug talks the agent protocol to the debugger stub on the board.">
  <!-- qjsx: the chain of the debugger, used by README.md. Hand-written; light
       and dark through prefers-color-scheme; one font size, bold for titles. -->
  <style>
    svg { --bg: #f6f8fa; --box: #ffffff; --edge: #d0d7de; --text: #1f2328; --muted: #59636e;
          --line: #59636e; --pc: #0969da; --pc-fill: #ddf4ff; --dev: #1a7f37; --dev-fill: #dafbe1; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #161b22; --box: #0d1117; --edge: #3d444d; --text: #e6edf3; --muted: #9198a1;
            --line: #9198a1; --pc: #4493f8; --pc-fill: #0f2440; --dev: #3fb950; --dev-fill: #0f2a1a; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
           font-size: 14px; fill: var(--text); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .title { font-weight: 600; }
    .muted { fill: var(--muted); }
    .c { text-anchor: middle; }
    .bg { fill: var(--bg); }
    .box { fill: var(--box); stroke: var(--edge); stroke-width: 1; }
    .pc { fill: var(--pc-fill); stroke: var(--pc); stroke-width: 1.5; }
    .dev { fill: var(--dev-fill); stroke: var(--dev); stroke-width: 1.5; }
    .pc-text { fill: var(--pc); }
    .dev-text { fill: var(--dev); }
    .arrow { fill: none; stroke: var(--line); stroke-width: 1.5; }
    .head { fill: var(--line); }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="880" height="336" rx="12"/>

  <!-- the PC -->
  <rect class="pc" x="16" y="16" width="532" height="280" rx="10"/>
  <text class="title pc-text" x="34" y="42">Your PC</text>

  <rect class="box" x="36" y="58" width="160" height="56" rx="6"/>
  <text class="title c" x="116" y="81">VS Code</text>
  <text class="muted c" x="116" y="101">js-debug, built in</text>

  <text class="muted c" x="116" y="146">breakpoints, stepping,</text>
  <text class="muted c" x="116" y="166">variables, evaluate</text>

  <rect class="box" x="316" y="58" width="212" height="56" rx="6"/>
  <text class="mono title c" x="422" y="81">qjsx debug</text>
  <text class="muted c" x="422" y="101">the proxy</text>

  <rect class="box" x="316" y="146" width="212" height="56" rx="6"/>
  <text class="title c" x="422" y="169">Debug info</text>
  <text class="muted c" x="422" y="189">lines, scopes, names</text>

  <rect class="box" x="316" y="222" width="212" height="56" rx="6"/>
  <text class="title c" x="422" y="245">Compiler</text>
  <text class="muted c" x="422" y="265">evaluated expressions</text>

  <!-- the board -->
  <rect class="dev" x="652" y="16" width="212" height="280" rx="10"/>
  <text class="title dev-text" x="670" y="42">The board</text>

  <rect class="box" x="672" y="58" width="172" height="56" rx="6"/>
  <text class="title c" x="758" y="81">Debugger stub</text>
  <text class="muted c" x="758" y="101">in the agent</text>

  <rect class="box" x="672" y="146" width="172" height="56" rx="6"/>
  <text class="title c" x="758" y="169">QuickJS</text>
  <text class="muted c" x="758" y="189">debug dispatch</text>

  <text class="muted c" x="758" y="236">pauses, steps, reads</text>
  <text class="muted c" x="758" y="256">frames and variables</text>

  <!-- arrows, drawn last: over the groups -->
  <path class="arrow" d="M198 86 H314" marker-start="url(#head)" marker-end="url(#head)"/>
  <text class="mono c" x="256" y="78">CDP</text>
  <text class="muted c" x="256" y="104">WebSocket :9339</text>

  <path class="arrow" d="M422 114 V144" marker-end="url(#head)"/>
  <path class="arrow" d="M528 104 H540 V250 H530" marker-end="url(#head)"/>

  <path class="arrow" d="M530 86 H670" marker-start="url(#head)" marker-end="url(#head)"/>
  <text class="c" x="600" y="78">agent protocol</text>
  <text class="muted c" x="600" y="104">serial, USB, TCP</text>

  <path class="arrow" d="M758 116 V144" marker-start="url(#head)" marker-end="url(#head)"/>

  <text class="muted c" x="440" y="322">Only numbers travel on the link: names, lines and sources stay on the PC.</text>
</svg>
