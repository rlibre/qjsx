# Components fetched by the ESP-IDF component manager (into
# ports/esp32/managed_components/, versions kept in dependencies.lock).
dependencies:
  # TinyUSB for device/usb (hal_usb_esp32.cpp), on the chips with USB OTG only
  # (the same list as QJSX_USB_TARGETS in CMakeLists.txt)
  espressif/esp_tinyusb:
    version: "^2.1.1"
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4]"
