# Components fetched by the ESP-IDF component manager (into
# ports/esp32/managed_components/, versions kept in dependencies.lock).
dependencies:
  # TinyUSB for device/usb (hal_usb_esp32.cpp), on the chips with USB OTG only
  # (the same list as QJSX_USB_TARGETS in CMakeLists.txt)
  espressif/esp_tinyusb:
    version: "^2.1.1"
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4]"

  # LittleFS for the "data" partition mounted on /data (board_esp32.cpp): the
  # files of the programs (sys/fs) and of the host (qjsx device ls / read /
  # write...). Version fixed (user, 2026-11-13: checked, no known advisory;
  # 1.23.1 fixes an overflow of esp_littlefs_info, which dataCapacity uses);
  # MIT, LittleFS itself BSD-3-Clause.
  joltwallet/littlefs:
    version: "==1.23.1"
